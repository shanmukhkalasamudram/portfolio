# Every day, pull new videos from the YouTube playlists in content/portfolio.json
# (videos.sources) into content/videos.json. When something new shows up it is
# committed to main, and Vercel redeploys the site.
name: Sync YouTube videos

on:
  schedule:
    - cron: "30 15 * * *" # daily, 15:30 UTC (after the usual 13:30 UTC uploads)
  workflow_dispatch: # "Run workflow" button on GitHub, for an immediate sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync-videos.mjs
      - name: Commit new videos
        run: |
          if git diff --quiet -- content/videos.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/videos.json
          git commit -m "Add new YouTube videos"
          git push
